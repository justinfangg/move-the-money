# Optional: a throwaway Postgres for running the app and tests.
#   docker compose up -d
#   export DATABASE_URL=postgres://postgres:postgres@localhost:5432/move_money
#   export TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/move_money_test
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: move_money
    ports:
      - "5432:5432"
    volumes:
      - ./db/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
